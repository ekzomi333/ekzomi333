name: Update profile stats

on:
  schedule:
    - cron: "30 3 * * *" # daily 03:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Checkout DSH stats sync repo
        uses: actions/checkout@v4
        with:
          repository: ekzomi333/ekzomi333-stats
          ref: main
          path: dsh-stats
          # public repo read — token only needed if you later make it private
          token: ${{ secrets.STATS_SYNC_TOKEN || github.token }}

      - name: Update README stats from synced DSH logs
        env:
          DSH_HOME: ${{ github.workspace }}/dsh-stats
        run: node scripts/update-stats.mjs

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: update lifetime activity stats [skip ci]"
          git push
